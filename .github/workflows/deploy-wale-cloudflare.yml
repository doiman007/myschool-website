name: Wale Kindergarten - Cloudflare Workers

on:
  push:
    branches:
      - lovable-wale-kindergarten-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-school
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Ensure public Supabase configuration exists
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Set SUPABASE_URL as repository variable"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Set SUPABASE_PUBLISHABLE_KEY as repository variable"; exit 1; }
      - name: Install dependencies
        run: |
          bun install
          bun add --dev @cloudflare/vite-plugin wrangler
      - name: Build Cloudflare Worker
        run: bunx vite build --config vite.cloudflare.config.ts
      - name: Deploy if separately enabled
        if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN as Actions secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID as Actions variable"; exit 1; }
          bunx wrangler deploy
